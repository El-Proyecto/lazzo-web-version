name: CI

on:
  push:
    branches: [main, backend, frontend]
  pull_request:
    branches: [main, backend, frontend]

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Lint
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Format check
        run: dart format --output=none lib test
        continue-on-error: true

      - name: Run unit+widget tests (coverage)
        run: |
          TEST_FILES=$(find test -name "*_test.dart" ! -name "*golden_test.dart" | tr '\n' ' ')
          flutter test --coverage $TEST_FILES

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 3


